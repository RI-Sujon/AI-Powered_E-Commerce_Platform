# CI/CD for the AKS learning environment (K8 — see docs/kubernetes-learning/k8-cicd-aks.md)
#
# Deliberately a SEPARATE pipeline file from azure-pipelines.yml, with `trigger: none` — this
# touches real, billable Azure compute (an AKS node pool), so it must never fire automatically on
# every push the way the Container Apps pipeline does. Run it manually ("Run pipeline" in Azure
# DevOps) only when you intend to spend an actual AKS session, and destroy afterwards (see the
# bottom of this file / the doc for the manual `terraform destroy` step this pipeline does NOT do
# for you on purpose).
#
#   Build       -> same as azure-pipelines.yml: docker build + az acr login + push, tagged
#                  $(Build.BuildId) and latest, to the shared ACR.
#   Deploy_AKS  -> terraform apply terraform/environments/aks-learning (remote state - see
#                  terraform/environments/aks-learning/backend.tf), az aks get-credentials,
#                  rewrite k8s/overlays/aks's image tags to this run's $(tag) instead of :latest,
#                  kubectl apply -k, wait for rollout, run EF Core migrations against the
#                  in-cluster Postgres via a temporary port-forward, then smoke-test the API
#                  through a temporary ingress-nginx (Helm, ClusterIP-only - no Load Balancer
#                  cost) the same way the 2026-10-12/13 manual sessions did.
#
# Prerequisites on the agent (pool 'GhorarDim'): everything azure-pipelines.yml already needs
# (Azure CLI, Docker, Terraform >= 1.5) PLUS kubectl and helm on PATH. The Preflight step below
# fails fast with a clear message if any are missing instead of failing confusingly later.
#
# No new secrets needed: the in-cluster Postgres password lives in k8s/base/app-secrets.yaml
# (same local-only-grade credential used by every k8s/ namespace, not a real secret - see K2 doc).

trigger: none
pr: none

pool:
  name: 'GhorarDim'
  workspace:
    clean: all

variables:
  - name: acrName
    value: 'ecommerceacrrabiuru'
  - name: webImageRepository
    value: 'ecommerceapp-web'
  - name: apiImageRepository
    value: 'ecommerceapp-api'
  - name: webDockerfilePath
    value: '$(Build.SourcesDirectory)/src/ProjectMainApp/Project.Web/Dockerfile'
  - name: apiDockerfilePath
    value: '$(Build.SourcesDirectory)/src/ProjectMainApp/Project.Endpoint/Dockerfile'
  - name: dockerBuildContext
    value: '$(Build.SourcesDirectory)/src/ProjectMainApp'
  - name: tag
    value: '$(Build.BuildId)'
  - name: azureSubscription
    value: 'Azure-AppServiceSujon-Connection'
  - name: aksTfRoot
    value: '$(Build.SourcesDirectory)/terraform/environments/aks-learning'
  - name: aksResourceGroup
    value: 'rg-ecommerce-aks-learning'
  - name: aksClusterName
    value: 'aks-ecommerce-learning'
  - name: aksNamespace
    value: 'ecommerce-aks'

stages:
  # ============================================================
  # STAGE 0: PREFLIGHT (fail fast if the agent is missing a tool)
  # ============================================================
  - stage: Preflight
    displayName: 'Preflight checks'
    jobs:
      - job: PreflightJob
        displayName: 'Confirm required tools on agent'
        steps:
          - task: PowerShell@2
            displayName: 'Check kubectl, helm, terraform, docker, az'
            inputs:
              targetType: inline
              script: |
                $ErrorActionPreference = 'Stop'
                foreach ($cmd in @('kubectl', 'helm', 'terraform', 'docker', 'az')) {
                  if (-not (Get-Command $cmd -ErrorAction SilentlyContinue)) {
                    throw "Required tool '$cmd' not found on PATH for this agent - install it before running this pipeline."
                  }
                }
                Write-Host "All required tools present."

  # ============================================================
  # STAGE 1: BUILD AND PUSH DOCKER IMAGES (identical pattern to azure-pipelines.yml)
  # ============================================================
  - stage: Build
    displayName: 'Build and Push Docker Images'
    dependsOn: Preflight
    condition: succeeded()
    jobs:
      - job: BuildJob
        displayName: 'Build Containers'
        steps:
          - checkout: self
            clean: true

          - task: AzureCLI@2
            displayName: 'az acr login'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'ps'
              scriptLocation: 'inlineScript'
              inlineScript: |
                $ErrorActionPreference = 'Stop'
                az acr login --name $(acrName)
                if ($LASTEXITCODE -ne 0) { throw "az acr login failed (exit $LASTEXITCODE)" }

          - script: |
              docker build -t $(acrName).azurecr.io/$(webImageRepository):$(tag) -t $(acrName).azurecr.io/$(webImageRepository):latest -f "$(webDockerfilePath)" "$(dockerBuildContext)"
            displayName: 'docker build - Web Image'

          - script: |
              docker push $(acrName).azurecr.io/$(webImageRepository):$(tag)
              docker push $(acrName).azurecr.io/$(webImageRepository):latest
            displayName: 'docker push - Web Image'

          - script: |
              docker build -t $(acrName).azurecr.io/$(apiImageRepository):$(tag) -t $(acrName).azurecr.io/$(apiImageRepository):latest -f "$(apiDockerfilePath)" "$(dockerBuildContext)"
            displayName: 'docker build - API Image'

          - script: |
              docker push $(acrName).azurecr.io/$(apiImageRepository):$(tag)
              docker push $(acrName).azurecr.io/$(apiImageRepository):latest
            displayName: 'docker push - API Image'

  # ============================================================
  # STAGE 2: DEPLOY TO AKS
  # ============================================================
  - stage: Deploy_AKS
    displayName: 'Deploy to AKS'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployAKS
        displayName: 'terraform apply + kubectl apply (aks-learning)'
        environment: 'AksRabiuru'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  clean: true

                - task: AzureCLI@2
                  displayName: 'terraform init + apply (aks-learning)'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: 'ps'
                    scriptLocation: 'inlineScript'
                    workingDirectory: '$(aksTfRoot)'
                    inlineScript: |
                      $ErrorActionPreference = 'Stop'
                      $env:ARM_USE_CLI = 'true'
                      if (Test-Path .terraform) { Remove-Item -Recurse -Force .terraform }

                      terraform init -input=false -reconfigure
                      if ($LASTEXITCODE -ne 0) { throw "terraform init failed (exit $LASTEXITCODE)" }

                      terraform apply -input=false -auto-approve
                      if ($LASTEXITCODE -ne 0) { throw "terraform apply failed (exit $LASTEXITCODE)" }

                      Write-Host "----- terraform output -----"
                      terraform output
                  env:
                    TF_IN_AUTOMATION: 'true'

                - task: AzureCLI@2
                  displayName: 'az aks get-credentials'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: 'ps'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      $ErrorActionPreference = 'Stop'
                      az aks get-credentials --resource-group $(aksResourceGroup) --name $(aksClusterName) --overwrite-existing
                      if ($LASTEXITCODE -ne 0) { throw "az aks get-credentials failed (exit $LASTEXITCODE)" }
                      kubectl get nodes

                - task: PowerShell@2
                  displayName: 'Pin image tags + kubectl apply -k k8s/overlays/aks'
                  inputs:
                    targetType: inline
                    workingDirectory: '$(Build.SourcesDirectory)'
                    script: |
                      $ErrorActionPreference = 'Stop'
                      $kustFile = 'k8s/overlays/aks/kustomization.yaml'
                      $content = Get-Content $kustFile -Raw
                      # Both images currently pin "newTag: latest" - swap in this run's build tag
                      # so the cluster always runs the image just built, not whatever "latest"
                      # happened to mean last time someone pushed. $(Build.BuildId) is a
                      # numeric-looking string (e.g. "8") - it MUST stay quoted in the YAML, or
                      # Kustomize rejects it ("cannot unmarshal number into ... newTag of type
                      # string") since newTag is schema-typed as a string, not an int.
                      $content = $content -replace 'newTag:\s*latest', "newTag: ""$(tag)"""
                      Set-Content -Path $kustFile -Value $content -NoNewline
                      Write-Host "----- rewritten kustomization.yaml -----"
                      Get-Content $kustFile

                      kubectl apply -k k8s/overlays/aks
                      if ($LASTEXITCODE -ne 0) { throw "kubectl apply -k failed (exit $LASTEXITCODE)" }

                      kubectl rollout status deployment/ecommerce-api -n $(aksNamespace) --timeout=180s
                      if ($LASTEXITCODE -ne 0) { throw "ecommerce-api rollout did not complete (exit $LASTEXITCODE)" }
                      kubectl rollout status deployment/ecommerce-web -n $(aksNamespace) --timeout=180s
                      if ($LASTEXITCODE -ne 0) { throw "ecommerce-web rollout did not complete (exit $LASTEXITCODE)" }

                - task: PowerShell@2
                  displayName: 'dotnet ef database update (AKS postgres, via temporary port-forward)'
                  inputs:
                    targetType: inline
                    workingDirectory: '$(Build.SourcesDirectory)/src/ProjectMainApp'
                    script: |
                      $ErrorActionPreference = 'Stop'
                      $dotnetTools = Join-Path $env:USERPROFILE '.dotnet\tools'
                      if ($env:PATH -notlike "*$dotnetTools*") { $env:PATH = "$env:PATH;$dotnetTools" }
                      if (-not (Get-Command dotnet-ef -ErrorAction SilentlyContinue)) {
                        dotnet tool install --global dotnet-ef
                        if ($LASTEXITCODE -ne 0) { throw "dotnet tool install dotnet-ef failed (exit $LASTEXITCODE)" }
                      }
                      dotnet restore Project.Endpoint/Project.Endpoint.csproj
                      if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed (exit $LASTEXITCODE)" }

                      # Fresh pods each run = fresh, empty Postgres until migrated - same bug
                      # pattern hit manually against ecommerce-prod and ecommerce-aks earlier.
                      # NOTE: $(aksNamespace) is an Azure Pipelines macro, substituted into this
                      # script's literal text before PowerShell ever runs it - it is NOT a real
                      # PowerShell variable, so it must be written plainly here, not as
                      # $using:aksNamespace (which needs an actual local variable to capture into
                      # the background job's scope and fails with "using variable ... not set").
                      $job = Start-Job -ScriptBlock {
                        kubectl port-forward -n $(aksNamespace) svc/postgres 15434:5432
                      }
                      Start-Sleep -Seconds 5
                      try {
                        $conn = "Host=localhost;Port=15434;Database=ecommercedb;Username=postgres;Password=K8sLearning@123;SSL Mode=Disable;"
                        dotnet ef database update --project Project.Data --startup-project Project.Endpoint --connection $conn
                        if ($LASTEXITCODE -ne 0) { throw "dotnet ef database update failed (exit $LASTEXITCODE)" }
                      } finally {
                        Stop-Job $job -ErrorAction SilentlyContinue
                        Remove-Job $job -Force -ErrorAction SilentlyContinue
                      }

                - task: PowerShell@2
                  displayName: 'Install/upgrade ingress-nginx (Helm, ClusterIP only - $0 marginal cost)'
                  inputs:
                    targetType: inline
                    script: |
                      $ErrorActionPreference = 'Stop'
                      helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx 2>$null
                      helm repo update
                      helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx `
                        --namespace ingress-nginx --create-namespace `
                        --set controller.service.type=ClusterIP `
                        --wait --timeout 3m
                      if ($LASTEXITCODE -ne 0) { throw "helm upgrade --install ingress-nginx failed (exit $LASTEXITCODE)" }
                      # Proof there's no Azure Load Balancer / Public IP behind this - must show <none>
                      kubectl get svc -n ingress-nginx ingress-nginx-controller

                - task: PowerShell@2
                  displayName: 'Smoke test through ingress (temporary port-forward)'
                  inputs:
                    targetType: inline
                    script: |
                      $ErrorActionPreference = 'Stop'
                      $job = Start-Job -ScriptBlock {
                        kubectl port-forward -n ingress-nginx svc/ingress-nginx-controller 18082:80
                      }
                      Start-Sleep -Seconds 5
                      try {
                        $apiCode = (curl.exe -s -o NUL -w "%{http_code}" http://localhost:18082/api/product/get-product-list)
                        Write-Host "api through ingress: $apiCode"
                        if ($apiCode -ne '200') { throw "Smoke test failed: expected 200 from /api/product/get-product-list, got $apiCode" }
                      } finally {
                        Stop-Job $job -ErrorAction SilentlyContinue
                        Remove-Job $job -Force -ErrorAction SilentlyContinue
                      }

# ============================================================
# NOT included on purpose: a Destroy_AKS stage.
#
# Tearing down real, billable infrastructure automatically (e.g. on a schedule, or in a `finally`
# of this same pipeline run) is too easy to get wrong silently - better to do it as a deliberate,
# separate, manual action every time:
#
#   cd terraform/environments/aks-learning
#   terraform destroy
#   az aks list -o table      # must be empty
#   az group list -o table    # rg-ecommerce-aks-learning must be gone
#
# See docs/kubernetes-learning/k8-cicd-aks.md and k7-aks.md §5 for the full safety-rail reasoning.
# ============================================================
