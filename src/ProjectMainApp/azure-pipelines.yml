# TRIGGER: Run when code is pushed to these branches
trigger:
  branches:
    include:
      - origin_latest
      - devops/13-initial-ci-pipeline  

# AGENT: self-hosted
pool:
  name: 'MyLocalAgent'

# Ensure the agent does not reuse stale sources from previous runs.
checkout:
  clean: true
  fetchDepth: 0

# VARIABLES: Define reusable values
variables:
  buildConfiguration: 'Release'  # Build in Release mode (optimized)
  dotnetVersion: '9.0.x'          # Match the target framework used by the solution

# PIPELINE STRUCTURE
stages:
  # ============ STAGE 1: BUILD ============
  - stage: Build
    displayName: 'Build and Test'
    jobs:
      - job: BuildJob
        displayName: 'Build Solution'
        steps:
          # STEP 1: Install .NET 10 SDK
          - task: UseDotNet@2
            displayName: 'Install .NET 9 SDK'
            inputs:
              version: '9.0.x'
              includePreviewVersions: false

          # STEP 2: Restore NuGet packages
          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet Packages'
            inputs:
              command: 'restore'
              projects: 'src/ProjectMainApp/ProjectMainApp.sln'
              workingDirectory: '$(Build.SourcesDirectory)'

          # STEP 3: Build the solution
          - task: DotNetCoreCLI@2
            displayName: 'Build Solution'
            inputs:
              command: 'build'
              projects: 'src/ProjectMainApp/ProjectMainApp.sln'
              arguments: '--configuration $(buildConfiguration) --no-restore'
              workingDirectory: '$(Build.SourcesDirectory)'

          # STEP 4: Run unit tests
          - task: DotNetCoreCLI@2
            displayName: 'Run Unit Tests'
            inputs:
              command: 'test'
              projects: 'src/ProjectMainApp/Project.Test/Project.Test.csproj'
              arguments: '--configuration $(buildConfiguration) --no-build'
              workingDirectory: '$(Build.SourcesDirectory)'
              publishTestResults: true          # Show test results in Azure DevOps
            continueOnError: true               # Don't fail if no tests found

          # STEP 5: Publish web app (prepare for deployment)
          - task: DotNetCoreCLI@2
            displayName: 'Publish Web App'
            inputs:
              command: 'publish'
              publishWebProjects: false         # Don't auto-detect, use 'projects'
              projects: 'src/ProjectMainApp/Project.Web/Project.Web.csproj'
              arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/web'
              workingDirectory: '$(Build.SourcesDirectory)'
              zipAfterPublish: true             # Create a .zip file

          # STEP 6: Upload artifacts for deployment stage
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Build Artifacts'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'drop'              # Named "drop" by convention

  # ============ STAGE 2: DEPLOY ============
  - stage: Deploy_Dev
    displayName: 'Deploy to Development'
    dependsOn: Build                            # Wait for Build stage
    condition: succeeded()                      # Only if Build succeeded
    jobs:
      - deployment: DeployWeb
        displayName: 'Deploy Web to Azure'
        environment: 'Development'              # Track deployments
        strategy:
          runOnce:                              # Simple deployment strategy
            deploy:
              steps:
                # STEP 1: Deploy to Azure App Service
                - task: AzureWebApp@1
                  displayName: 'Deploy to Azure App Service'
                  inputs:
                    azureSubscription: 'Azure-AppService-Connection'
                    appType: 'webAppLinux'      # Linux App Service
                    appName: 'e-commerce-sujon407'
                    package: '$(Pipeline.Workspace)/drop/web/*.zip'
                    runtimeStack: 'DOTNETCORE|9.0'