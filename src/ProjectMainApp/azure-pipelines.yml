# TRIGGER: Run when code is pushed to these branches
trigger:
  branches:
    include:
      - origin_latest
      - devops/13-initial-ci-pipeline  

# AGENT: self-hosted
pool:
  name: 'MyLocalAgent'
  workspace:
    clean: all

# VARIABLES: Define reusable values
variables:
  buildConfiguration: 'Release'
  dotnetVersion: '9.0.x'

# PIPELINE STRUCTURE
stages:
  # ============ STAGE 1: BUILD ============
  - stage: Build
    displayName: 'Build and Test'
    jobs:
      - job: BuildJob
        displayName: 'Build .NET 9 Solution'
        steps:
          # STEP 1: Install .NET 9 SDK
          - task: UseDotNet@2
            displayName: 'Install .NET 9 SDK'
            inputs:
              version: $(dotnetVersion)
              includePreviewVersions: false

          # STEP 1.5: Display .NET version (for debugging) ← NEW
          - script: dotnet --version
            displayName: 'Display .NET Version'
            workingDirectory: '$(Build.SourcesDirectory)'

          # STEP 2: Restore NuGet packages
          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet Packages'
            inputs:
              command: 'restore'
              projects: 'src/ProjectMainApp/ProjectMainApp.sln'
              workingDirectory: '$(Build.SourcesDirectory)'

          # STEP 3: Build the solution
          - task: DotNetCoreCLI@2
            displayName: 'Build Solution'
            inputs:
              command: 'build'
              projects: 'src/ProjectMainApp/ProjectMainApp.sln'
              arguments: '--configuration $(buildConfiguration) --no-restore'
              workingDirectory: '$(Build.SourcesDirectory)'

          # STEP 4: Run unit tests
          - task: DotNetCoreCLI@2
            displayName: 'Run Unit Tests'
            inputs:
              command: 'test'
              projects: 'src/ProjectMainApp/Project.Test/Project.Test.csproj'
              arguments: '--configuration $(buildConfiguration) --no-build --logger trx'  # ← Added logger
              workingDirectory: '$(Build.SourcesDirectory)'
              publishTestResults: true
            continueOnError: true

          # STEP 5: Publish web app (prepare for deployment)
          - task: DotNetCoreCLI@2
            displayName: 'Publish Web App'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: 'src/ProjectMainApp/Project.Web/Project.Web.csproj'
              arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/web --no-build -p:TreatWarningsAsErrors=false'  # ← Added --no-build
              workingDirectory: '$(Build.SourcesDirectory)'
              zipAfterPublish: true

          # STEP 6: Upload artifacts for deployment stage
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Build Artifacts'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'drop'
              publishLocation: 'Container'  # ← Added this for clarity

  # ============ STAGE 2: DEPLOY TO DEV ============
  - stage: Deploy_Dev
    displayName: 'Deploy to Development'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployDev  # ← Changed from DeployWeb to DeployDev
        displayName: 'Deploy to Dev Environment'
        environment: 'Development'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: 'Deploy to Dev App Service'
                  inputs:
                    azureSubscription: 'Azure-AppService-Connection'
                    appType: 'webAppLinux'
                    appName: 'e-commerce-sujon'  # Your dev app name
                    package: '$(Pipeline.Workspace)/drop/web/*.zip'
                    runtimeStack: 'DOTNETCORE|9.0'

                # NEW: Deployment summary
                - script: |
                    echo "========================================"
                    echo "✅ DEPLOYMENT TO DEV SUCCESSFUL"
                    echo "========================================"
                    echo "Environment: Development"
                    echo "URL: https://e-commerce-sujon.azurewebsites.net"
                    echo "========================================"
                  displayName: 'Dev Deployment Summary'

  # ============ STAGE 3: DEPLOY TO STAGING ============
  - stage: Deploy_Staging
    displayName: 'Deploy to Staging'
    dependsOn: Deploy_Dev  # Wait for Dev deployment
    condition: succeeded()
    jobs:
      - deployment: DeployStaging
        displayName: 'Deploy to Staging Environment'
        environment: 'StagingSujon'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: 'Deploy to Staging App Service'
                  inputs:
                    azureSubscription: 'Azure-AppService-Connection'
                    appType: 'webAppLinux'
                    appName: 'e-commerce-sujon-staging'  # Your staging app
                    package: '$(Pipeline.Workspace)/drop/web/*.zip'
                    runtimeStack: 'DOTNETCORE|9.0'

                - script: |
                    echo "========================================"
                    echo "✅ DEPLOYMENT TO STAGING SUCCESSFUL"
                    echo "========================================"
                    echo "Environment: Staging"
                    echo "URL: https://e-commerce-sujon-staging.azurewebsites.net"
                    echo ""
                    echo "⚠️  Please test before approving production!"
                    echo "========================================"
                  displayName: 'Staging Deployment Summary'

  # ============ STAGE 4: DEPLOY TO PRODUCTION ============
  - stage: Deploy_Production
    displayName: 'Deploy to Production'
    dependsOn: Deploy_Staging  # Wait for Staging deployment
    condition: succeeded()
    jobs:
      - deployment: DeployProduction
        displayName: 'Deploy to Production Environment'
        environment: 'ProductionSujon'  # This will trigger approval gate
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: 'Deploy to Production App Service'
                  inputs:
                    azureSubscription: 'Azure-AppService-Connection'
                    appType: 'webAppLinux'
                    appName: 'e-commerce-sujon-prod'  # Your prod app
                    package: '$(Pipeline.Workspace)/drop/web/*.zip'
                    runtimeStack: 'DOTNETCORE|9.0'

                - script: |
                    echo "========================================"
                    echo "🎉 PRODUCTION DEPLOYMENT SUCCESSFUL!"
                    echo "========================================"
                    echo "Environment: Production"
                    echo "URL: https://e-commerce-sujon-prod.azurewebsites.net"
                    echo ""
                    echo "Your app is now LIVE!"
                    echo "========================================"
                  displayName: 'Production Deployment Summary'