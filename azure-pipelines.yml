trigger:
  branches:
    include:
      - devops/containerization-main

pool:
  name: 'MyLocalAgent2'
  workspace:
    clean: all

variables:
  dockerHubConnection: 'dockerhub-connection'
  webImageRepository: 'rabiul1012/ecommerceapp-web'
  apiImageRepository: 'rabiul1012/ecommerceapp-api'
  webDockerfilePath: '$(Build.SourcesDirectory)/src/ProjectMainApp/Project.Web/Dockerfile'
  apiDockerfilePath: '$(Build.SourcesDirectory)/src/ProjectMainApp/Project.Endpoint/Dockerfile'
  dockerBuildContext: '$(Build.SourcesDirectory)/src/ProjectMainApp'
  tag: '$(Build.BuildId)'
  azureSubscription: 'Azure-AppService-Connection'
  resourceGroup: 'ecommerce-rg'
  containerAppEnv: 'ecommerce-env'
  # PostgreSQL connection details
  postgresServer: 'ecommerce-postgres-sujon.postgres.database.azure.com'
  postgresDb: 'ecommercedb'
  postgresUser: 'postgres'
  postgresPassword: 'postgres'  # Change this to match what you used

stages:
  # ============ STAGE 1: BUILD ============
  - stage: Build
    displayName: 'Build and Push Docker Images'
    jobs:
      - job: BuildJob
        displayName: 'Build Containers'
        steps:
          - script: docker --version
            displayName: 'Verify Docker'

          # Build and Push Web Image
          - task: Docker@2
            displayName: 'Build and Push Web Image'
            inputs:
              command: buildAndPush
              repository: $(webImageRepository)
              dockerfile: $(webDockerfilePath)
              buildContext: $(dockerBuildContext)
              containerRegistry: $(dockerHubConnection)
              tags: |
                $(tag)
                latest

          # Build and Push API Image
          - task: Docker@2
            displayName: 'Build and Push API Image'
            inputs:
              command: buildAndPush
              repository: $(apiImageRepository)
              dockerfile: $(apiDockerfilePath)
              buildContext: $(dockerBuildContext)
              containerRegistry: $(dockerHubConnection)
              tags: |
                $(tag)
                latest

  # ============ STAGE 2: DEPLOY DEV ============
  - stage: Deploy_Dev
    displayName: 'Deploy to Development'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployDev
        displayName: 'Deploy to Dev'
        environment: 'Development'
        strategy:
          runOnce:
            deploy:
              steps:
                # Deploy API Container App
                - task: AzureCLI@2
                  displayName: 'Deploy API Container App'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      # PostgreSQL connection string
                      POSTGRES_CONN="Host=$(postgresServer);Database=$(postgresDb);Username=$(postgresUser);Password=$(postgresPassword);SSL Mode=Require;"
                      
                      az containerapp create \
                        --name ecommerce-api-dev \
                        --resource-group $(resourceGroup) \
                        --environment $(containerAppEnv) \
                        --image docker.io/$(apiImageRepository):$(tag) \
                        --target-port 8080 \
                        --ingress internal \
                        --secrets \
                          postgres-connection="$POSTGRES_CONN" \
                        --env-vars \
                          "ConnectionStrings__DefaultConnection=secretref:postgres-connection" \
                          "ASPNETCORE_ENVIRONMENT=Development" \
                        --min-replicas 1 \
                        --max-replicas 3 \
                        --cpu 0.5 \
                        --memory 1.0Gi \
                        2>/dev/null || az containerapp update \
                        --name ecommerce-api-dev \
                        --resource-group $(resourceGroup) \
                        --image docker.io/$(apiImageRepository):$(tag)

                # Deploy Web Container App
                - task: AzureCLI@2
                  displayName: 'Deploy Web Container App'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      API_URL=$(az containerapp show \
                        --name ecommerce-api-dev \
                        --resource-group $(resourceGroup) \
                        --query properties.configuration.ingress.fqdn \
                        -o tsv)
                      
                      az containerapp create \
                        --name ecommerce-web-dev \
                        --resource-group $(resourceGroup) \
                        --environment $(containerAppEnv) \
                        --image docker.io/$(webImageRepository):$(tag) \
                        --target-port 8080 \
                        --ingress external \
                        --env-vars \
                          "API_URL=https://$API_URL" \
                          "ASPNETCORE_ENVIRONMENT=Development" \
                        --min-replicas 1 \
                        --max-replicas 5 \
                        --cpu 0.5 \
                        --memory 1.0Gi \
                        2>/dev/null || az containerapp update \
                        --name ecommerce-web-dev \
                        --resource-group $(resourceGroup) \
                        --image docker.io/$(webImageRepository):$(tag)

                # Get URLs
                - task: AzureCLI@2
                  displayName: 'Get App URLs'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      WEB_URL=$(az containerapp show \
                        --name ecommerce-web-dev \
                        --resource-group $(resourceGroup) \
                        --query properties.configuration.ingress.fqdn \
                        -o tsv)
                      
                      API_URL=$(az containerapp show \
                        --name ecommerce-api-dev \
                        --resource-group $(resourceGroup) \
                        --query properties.configuration.ingress.fqdn \
                        -o tsv)
                      
                      echo "========================================="
                      echo "✅ DEV DEPLOYMENT SUCCESSFUL"
                      echo "========================================="
                      echo "Web App: https://$WEB_URL"
                      echo "API App: https://$API_URL"
                      echo "Database: PostgreSQL on Azure"
                      echo "Image Tag: $(tag)"
                      echo "========================================="

  # ============ STAGE 3: DEPLOY STAGING ============
  - stage: Deploy_Staging
    displayName: 'Deploy to Staging'
    dependsOn: Deploy_Dev
    condition: succeeded()
    jobs:
      - deployment: DeployStaging
        displayName: 'Deploy to Staging'
        environment: 'StagingSujon'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: 'Deploy API to Staging'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      POSTGRES_CONN="Host=$(postgresServer);Database=$(postgresDb);Username=$(postgresUser);Password=$(postgresPassword);SSL Mode=Require;"
                      
                      az containerapp create \
                        --name ecommerce-api-staging \
                        --resource-group $(resourceGroup) \
                        --environment $(containerAppEnv) \
                        --image docker.io/$(apiImageRepository):$(tag) \
                        --target-port 8080 \
                        --ingress internal \
                        --secrets \
                          postgres-connection="$POSTGRES_CONN" \
                        --env-vars \
                          "ConnectionStrings__DefaultConnection=secretref:postgres-connection" \
                          "ASPNETCORE_ENVIRONMENT=Staging" \
                        --min-replicas 1 \
                        --max-replicas 3 \
                        2>/dev/null || az containerapp update \
                        --name ecommerce-api-staging \
                        --resource-group $(resourceGroup) \
                        --image docker.io/$(apiImageRepository):$(tag)

                - task: AzureCLI@2
                  displayName: 'Deploy Web to Staging'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      API_URL=$(az containerapp show \
                        --name ecommerce-api-staging \
                        --resource-group $(resourceGroup) \
                        --query properties.configuration.ingress.fqdn \
                        -o tsv)
                      
                      az containerapp create \
                        --name ecommerce-web-staging \
                        --resource-group $(resourceGroup) \
                        --environment $(containerAppEnv) \
                        --image docker.io/$(webImageRepository):$(tag) \
                        --target-port 8080 \
                        --ingress external \
                        --env-vars \
                          "API_URL=https://$API_URL" \
                          "ASPNETCORE_ENVIRONMENT=Staging" \
                        --min-replicas 1 \
                        --max-replicas 5 \
                        2>/dev/null || az containerapp update \
                        --name ecommerce-web-staging \
                        --resource-group $(resourceGroup) \
                        --image docker.io/$(webImageRepository):$(tag)

  # ============ STAGE 4: DEPLOY PRODUCTION ============
  - stage: Deploy_Production
    displayName: 'Deploy to Production'
    dependsOn: Deploy_Staging
    condition: succeeded()
    jobs:
      - deployment: DeployProduction
        displayName: 'Deploy to Production'
        environment: 'ProductionSujon'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: 'Deploy API to Production'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      POSTGRES_CONN="Host=$(postgresServer);Database=$(postgresDb);Username=$(postgresUser);Password=$(postgresPassword);SSL Mode=Require;"
                      
                      az containerapp create \
                        --name ecommerce-api-prod \
                        --resource-group $(resourceGroup) \
                        --environment $(containerAppEnv) \
                        --image docker.io/$(apiImageRepository):$(tag) \
                        --target-port 8080 \
                        --ingress internal \
                        --secrets \
                          postgres-connection="$POSTGRES_CONN" \
                        --env-vars \
                          "ConnectionStrings__DefaultConnection=secretref:postgres-connection" \
                          "ASPNETCORE_ENVIRONMENT=Production" \
                        --min-replicas 2 \
                        --max-replicas 10 \
                        --cpu 1.0 \
                        --memory 2.0Gi \
                        2>/dev/null || az containerapp update \
                        --name ecommerce-api-prod \
                        --resource-group $(resourceGroup) \
                        --image docker.io/$(apiImageRepository):$(tag)

                - task: AzureCLI@2
                  displayName: 'Deploy Web to Production'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      API_URL=$(az containerapp show \
                        --name ecommerce-api-prod \
                        --resource-group $(resourceGroup) \
                        --query properties.configuration.ingress.fqdn \
                        -o tsv)
                      
                      az containerapp create \
                        --name ecommerce-web-prod \
                        --resource-group $(resourceGroup) \
                        --environment $(containerAppEnv) \
                        --image docker.io/$(webImageRepository):$(tag) \
                        --target-port 8080 \
                        --ingress external \
                        --env-vars \
                          "API_URL=https://$API_URL" \
                          "ASPNETCORE_ENVIRONMENT=Production" \
                        --min-replicas 2 \
                        --max-replicas 10 \
                        --cpu 1.0 \
                        --memory 2.0Gi \
                        2>/dev/null || az containerapp update \
                        --name ecommerce-web-prod \
                        --resource-group $(resourceGroup) \
                        --image docker.io/$(webImageRepository):$(tag)

                - script: |
                    echo "========================================="
                    echo "🎉 PRODUCTION DEPLOYMENT COMPLETE!"
                    echo "========================================="
                    echo "✅ Web + API deployed to Container Apps"
                    echo "✅ PostgreSQL database connected"
                    echo "✅ Auto-scaling enabled"
                    echo "Your e-commerce app is now LIVE!"
                    echo "========================================="
                  displayName: 'Success Message'