trigger:
  branches:
    include:
      - devops/containerization-main

pool:
  name: 'MyLocalAgent2'
  workspace:
    clean: all

variables:
  dockerHubConnection: 'dockerhub-connection'      # NEW: Docker Hub service connection
  imageRepository: 'rabiul1012/ecommerceapp'    # NEW: your Docker Hub repo
  dockerfilePath: '$(Build.SourcesDirectory)/src/ProjectMainApp/Project.Web/Dockerfile'  # adjust path
  dockerBuildContext: '$(Build.SourcesDirectory)/src/ProjectMainApp'
  tag: '$(Build.BuildId)'
  azureSubscriptionConnection: 'Azure-AppService-Connection'  # same as before

stages:
  # ============ STAGE 1: BUILD & PUSH IMAGE ============
  - stage: Build
    displayName: 'Build and Push Docker Image'
    jobs:
      - job: BuildJob
        displayName: 'Build and Push Container Image'
        steps:
          - script: docker --version
            displayName: 'Verify Docker is available on agent'

          - task: Docker@2
            displayName: 'Build and Push Image to Docker Hub'
            inputs:
              command: buildAndPush
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              buildContext: $(dockerBuildContext)
              containerRegistry: $(dockerHubConnection)
              tags: |
                $(tag)
                latest

  # ============ STAGE 2: DEPLOY TO DEV ============
  - stage: Deploy_Dev
    displayName: 'Deploy to Development'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployDev
        displayName: 'Deploy to Dev Environment'
        environment: 'Development'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  displayName: 'Deploy to Dev App Service'
                  inputs:
                    azureSubscription: $(azureSubscriptionConnection)
                    appName: 'e-commerce-sujon'
                    containers: 'docker.io/$(imageRepository):$(tag)'

                - script: |
                    echo "========================================"
                    echo "✅ DEPLOYMENT TO DEV SUCCESSFUL"
                    echo "========================================"
                    echo "Environment: Development"
                    echo "Image Tag: $(tag)"
                    echo "URL: https://e-commerce-sujon.azurewebsites.net"
                    echo "========================================"
                  displayName: 'Dev Deployment Summary'

  # ============ STAGE 3: DEPLOY TO STAGING ============
  - stage: Deploy_Staging
    displayName: 'Deploy to Staging'
    dependsOn: Deploy_Dev
    condition: succeeded()
    jobs:
      - deployment: DeployStaging
        displayName: 'Deploy to Staging Environment'
        environment: 'StagingSujon'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  displayName: 'Deploy to Staging App Service'
                  inputs:
                    azureSubscription: $(azureSubscriptionConnection)
                    appName: 'e-commerce-sujon-staging'
                    containers: 'docker.io/$(imageRepository):$(tag)'

                - script: |
                    echo "========================================"
                    echo "✅ DEPLOYMENT TO STAGING SUCCESSFUL"
                    echo "========================================"
                    echo "Environment: Staging"
                    echo "Image Tag: $(tag)"
                    echo "URL: https://e-commerce-sujon-staging.azurewebsites.net"
                    echo ""
                    echo "⚠️  Please test before approving production!"
                    echo "========================================"
                  displayName: 'Staging Deployment Summary'

  # ============ STAGE 4: DEPLOY TO PRODUCTION ============
  - stage: Deploy_Production
    displayName: 'Deploy to Production'
    dependsOn: Deploy_Staging
    condition: succeeded()
    jobs:
      - deployment: DeployProduction
        displayName: 'Deploy to Production Environment'
        environment: 'ProductionSujon'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  displayName: 'Deploy to Production App Service'
                  inputs:
                    azureSubscription: $(azureSubscriptionConnection)
                    appName: 'e-commerce-sujon-prod'
                    containers: 'docker.io/$(imageRepository):$(tag)'

                - script: |
                    echo "========================================"
                    echo "🎉 PRODUCTION DEPLOYMENT SUCCESSFUL!"
                    echo "========================================"
                    echo "Environment: Production"
                    echo "Image Tag: $(tag)"
                    echo "URL: https://e-commerce-sujon-prod.azurewebsites.net"
                    echo ""
                    echo "Your app is now LIVE!"
                    echo "========================================"
                  displayName: 'Production Deployment Summary'