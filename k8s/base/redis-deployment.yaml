# No PersistentVolumeClaim here, deliberately - Redis is used as a cache (see
# docs/redis-integration/README.md), and the app already falls back to in-memory caching if
# Redis is unreachable. Losing cached data on a restart is expected and fine; not every
# stateful-looking thing needs durable storage.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ecommerce
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
