# Kustomize's own manifest - lists every plain resource file that makes up "the app," so an
# overlay can say "give me all of that" with one line (`resources: [../../base]`) instead of
# repeating this file list three times. Nothing in this file is environment-specific; that's
# entirely the overlays' job (see k8s/overlays/{dev,staging,prod}/kustomization.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - app-config.yaml
  - app-secrets.yaml
  - postgres-pvc.yaml
  - postgres-deployment.yaml
  - postgres-service.yaml
  - redis-deployment.yaml
  - redis-service.yaml
  - api-deployment.yaml
  - api-service.yaml
  - web-deployment.yaml
  - web-service.yaml
  - ingress.yaml
