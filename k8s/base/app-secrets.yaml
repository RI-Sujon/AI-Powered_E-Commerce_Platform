# Unlike K1's Secret (created imperatively, never a file - it held the REAL Azure dev DB
# password), this one is safe to commit: every credential here is invented fresh for this
# local-only learning cluster and protects nothing real - no Azure resource, no real user data.
# Never apply this reasoning to a credential that's actually true anywhere else.
#
# `stringData` (vs `data`) lets you write plaintext values here; Kubernetes base64-encodes them
# automatically on `kubectl apply` and stores the result as `data` in etcd. `kubectl get secret`
# still won't print the values back to you - that's convenience, not encryption (see the K1 doc).
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: ecommerce
type: Opaque
stringData:
  postgres-password: "K8sLearning@123"
  jwt-key: "k8s-learning-local-key-not-a-secret-1234567890"
  # "postgres" and "redis" below are Service names (see postgres-service.yaml / redis-service.yaml) -
  # Kubernetes gives every Service a DNS name resolvable by other Pods in the same namespace.
  db-connection-string: "Host=postgres;Port=5432;Database=ecommercedb;Username=postgres;Password=K8sLearning@123;SSL Mode=Disable;"
  redis-connection-string: "redis:6379"
